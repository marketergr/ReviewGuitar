<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="{{keywords}}">
    <title>{{title}}</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header>
        <h1>{{siteTitle}}</h1>
        <nav>
            <a href="../../index.html">Home</a> > 
            <a href="../index.html">{{siloDisplayName}}</a> > 
            {{pageTitle}}
        </nav>
    </header>
    <main>
        <article>
            <h2>{{pageTitle}}</h2>
            <div class="content">
                {{content}}
            </div>
            <aside class="related">
                <h3>Related Articles</h3>
                <ul>
                    {{relatedLinks}}
                </ul>
            </aside>
        </article>
    </main>
    <footer>
        <p>&copy; 2026 GuitarReview.com. Affiliate disclosure applies.</p>
    </footer>
</body>
</html>
